.pr{max-width:860px;margin:0 auto}
.phead{background:var(--cobd);color:#fff;border-radius:22px;padding:clamp(24px,4vw,40px)}
.phead h1{color:#fff;font-size:clamp(28px,4vw,42px);margin-top:6px}
.phead .kicker{color:#9fe3e1}
.meta2{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px;color:#dbe4f7;font-size:15px}
.sec{margin-top:34px}
.sec h2{font-size:clamp(20px,2.4vw,26px)}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:start;border-bottom:1px solid var(--line);padding:14px 0}
.li .t{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tq);padding-top:3px;min-width:84px}
.li .d{color:var(--soft);font-size:14px;margin-top:2px}
.li .p{font-weight:700;white-space:nowrap}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding:18px;border-radius:16px;background:var(--pan)}
.tot b{font-family:Marcellus,serif;font-size:30px;color:var(--cob)}
.dayc{border-left:3px solid var(--tq);padding:4px 0 4px 16px;margin-top:16px}
.dayc h3{font-size:18px}
.dayc p{color:var(--soft);margin-top:6px;white-space:pre-line}
.boxp{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,28px);margin-top:16px}
.boxp p{white-space:pre-line}
@media print{nav,.wa,.noprint,footer{display:none!important}.band{padding:0}.phead{background:#fff;color:#000;border:1px solid #ccc}.phead h1,.phead .meta2{color:#000}}
